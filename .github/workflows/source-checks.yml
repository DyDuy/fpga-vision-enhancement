name: Source and tooling checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r software/python/requirements.txt
      - run: python software/python/check_project.py --hps-syntax
# Deliberately no claim of RTL simulation, Quartus build or hardware sign-off.
