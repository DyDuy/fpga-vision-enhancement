<svg xmlns="http://www.w3.org/2000/svg" width="600" height="970" viewBox="0 0 600 970" role="img" aria-labelledby="title desc">
<title id="title">Maintained RTL pipeline</title>
<desc id="desc">RGB input branches into per-pixel Cmax and Cmin extraction and an aligned RGB delay. Features pass through registered 1×1 features, the transmission LUT and strength scaling with a floor. Refined transmission feeds the reciprocal LUT and atmospheric-light estimator. Aligned RGB also feeds atmospheric estimation and restoration. The reciprocal LUT, atmospheric estimate and aligned RGB feed radiance restoration and clipping, followed by gamma LUTs and processed RGB.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#6db9ff"/></marker><marker id="teal-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#5eead4"/></marker></defs>
<rect width="600" height="970" rx="18" fill="#0b1220"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#f8fafc;text-anchor:middle}.node{fill:#13243b;stroke:#4278a5;stroke-width:1.5}.accent{fill:#113334;stroke:#47b9ac;stroke-width:1.5}.edge{fill:none;stroke:#6db9ff;stroke-width:2.5;stroke-linejoin:round;marker-end:url(#arrow)}.control{fill:none;stroke:#5eead4;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#teal-arrow)}</style>
<text x="300" y="37" font-size="25" font-weight="700">Maintained RTL pipeline</text>
<path class="edge" d="M300 116 V134 H180 V150"/>
<path class="edge" d="M415 88 H450 V240"/>
<path class="edge" d="M180 214 V240"/>
<path class="edge" d="M180 304 V330"/>
<path class="edge" d="M180 394 V420"/>
<path class="edge" d="M180 484 V550"/>
<path class="edge" d="M295 452 H350"/>
<path class="edge" d="M450 304 V420"/>
<path class="edge" d="M555 272 H575 V712 H420"/>
<path class="edge" d="M450 484 V650 H300 V680"/>
<path class="edge" d="M180 614 V650 H240 V680"/>
<path class="edge" d="M300 744 V780"/>
<path class="edge" d="M300 844 V870"/>
<g><rect class="node" x="185" y="60" width="230" height="56" rx="10"/><text x="300" y="96" font-size="22">RGB input</text></g>
<g><rect class="node" x="65" y="150" width="230" height="64" rx="10"/><text x="180" y="177.5" font-size="22">Per-pixel</text><text x="180" y="202.5" font-size="22">Cmax / Cmin</text></g>
<g><rect class="node" x="65" y="240" width="230" height="64" rx="10"/><text x="180" y="267.5" font-size="22">Registered</text><text x="180" y="292.5" font-size="22">1×1 features</text></g>
<g><rect class="node" x="65" y="330" width="230" height="64" rx="10"/><text x="180" y="370" font-size="22">Transmission LUT</text></g>
<g><rect class="node" x="65" y="420" width="230" height="64" rx="10"/><text x="180" y="447.5" font-size="22">Strength scaling</text><text x="180" y="472.5" font-size="22">and floor</text></g>
<g><rect class="accent" x="350" y="240" width="205" height="64" rx="10"/><text x="452.5" y="267.5" font-size="22">Aligned RGB</text><text x="452.5" y="292.5" font-size="22">delay</text></g>
<g><rect class="accent" x="350" y="420" width="205" height="64" rx="10"/><text x="452.5" y="447.5" font-size="22">Atmospheric-light</text><text x="452.5" y="472.5" font-size="22">estimate</text></g>
<g><rect class="node" x="65" y="550" width="230" height="64" rx="10"/><text x="180" y="590" font-size="22">Reciprocal LUT</text></g>
<g><rect class="accent" x="180" y="680" width="240" height="64" rx="10"/><text x="300" y="707.5" font-size="22">Radiance restoration</text><text x="300" y="732.5" font-size="22">and clipping</text></g>
<g><rect class="node" x="180" y="780" width="240" height="64" rx="10"/><text x="300" y="820" font-size="22">Gamma LUTs</text></g>
<g><rect class="node" x="180" y="870" width="240" height="64" rx="10"/><text x="300" y="910" font-size="22">Processed RGB</text></g>
</svg>

