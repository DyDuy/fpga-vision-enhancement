  atmospheric_light:
    width_bits: 8
    reset_value: 220
    update_max_threshold: 50
    transmission_threshold_raw: 220
  restoration:
    channel_difference_register_bits: 18
    channel_difference_signed: true
    inverse_lut_output_bits: 14
    inverse_lut_formula: 'address < 100 ? 10240 : floor(1048576 / address)'
    multiply_register_bits: 32
    multiply_signed: true
    arithmetic_right_shift_bits: 10
    accumulator_bits: 32
    accumulator_signed: true
